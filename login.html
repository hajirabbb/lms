<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login — Tech4Girls LMS</title>
	<meta name="description" content="Log in to your Tech4Girls LMS dashboard as a Student, Lecturer, or Administrator.">
	<!-- Favicon -->
	<link rel="icon" type="image/png" href="img/Tech4Girls logo.png">
	<link rel="apple-touch-icon" href="img/Tech4Girls logo.png">
	<!-- Poppins font -->
	<link rel="preconnect" href="https://fonts.gstatic.com">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
	<!-- Custom styles -->
	<link rel="stylesheet" href="css/skilline.css" />
</head>
<body class="login-page">
`	
	<nav class="navbar" id="navbar">
		<div class="navbar-inner">
			<a href="index.html" class="navbar-logo" id="logo-link">
				<img src="img/Tech4Girls logo.png" alt="Tech4Girls Logo">
			</a>
			<button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<line x1="3" y1="6" x2="21" y2="6"></line>
					<line x1="3" y1="12" x2="21" y2="12"></line>
					<line x1="3" y1="18" x2="21" y2="18"></line>
				</svg>
			</button>
			<ul class="navbar-links" id="navbar-links">
				<li><a href="index.html" id="nav-home">Home</a></li>
				<li><a href="index.html#about" id="nav-about">About</a></li>
				<li><a href="login.html" class="navbar-login-btn" id="nav-login">Login</a></li>
			</ul>
		</div>
	</nav>

	<!-- ========== LOGIN FORM ========== -->
	<main class="login-main">
		<div class="login-container">
			<div class="login-card">
				<!-- Logo header -->
				<div class="login-logo">
					<img src="img/Tech4Girls logo.png" alt="Tech4Girls Logo">
					<h2>Welcome Back</h2>
					<p>Sign in to your Tech4Girls LMS account</p>
				</div>

				<!-- Role selector tabs -->
				<div class="role-selector" id="role-selector">
					<button type="button" class="role-tab active" data-role="student" id="tab-student">
						Student
					</button>
					<button type="button" class="role-tab" data-role="lecturer" id="tab-lecturer">
						 Lecturer
					</button>
					<button type="button" class="role-tab" data-role="admin" id="tab-admin">
						Admin
					</button>
				</div>

				<!-- Role icon display -->
				<div class="role-icon-display" id="role-icon"></div>

				<!-- Login form -->
				<form id="login-form" action="#" method="POST">
					<input type="hidden" name="role" id="role-input" value="student">

					<div class="form-group">
						<label class="form-label" for="email">Email Address</label>
						<input type="email" class="form-input" id="email" name="email" placeholder="you@example.com" required>
					</div>

					<div class="form-group">
						<label class="form-label" for="password">Password</label>
						<input type="password" class="form-input" id="password" name="password" placeholder="Enter your password" required>
					</div>

					<div class="form-row">
						<label class="form-remember">
							<input type="checkbox" id="remember" name="remember">
							Remember me
						</label>
						<a href="#" class="form-forgot">Forgot password?</a>
					</div>

					<button type="submit" class="btn-login" id="login-submit">
						Sign In
					</button>
				</form>

				<p class="login-footer-text">
					Don't have an account? <a href="#">Contact your administrator</a>
				</p>
			</div>
		</div>
	</main>

	<!-- ========== FOOTER ========== -->
	<footer class="footer" id="footer">
		<div class="footer-inner">
			<div class="footer-brand">
				<img src="img/Tech4Girls logo.png" alt="Tech4Girls Logo">
				<div class="divider"></div>
				<span>Learning Management System</span>
			</div>
			<div class="footer-partner">
				<img src="img/hacsa logo.jpg" alt="HACSA Logo">
				<span>HACSA Foundation</span>
			</div>
			<p class="footer-copy">&copy; 2025 Tech4Girls by HACSA Foundation. All rights reserved.</p>
		</div>
	</footer>

	<script>
		// ===== Mobile nav toggle =====
		const navToggle = document.getElementById('nav-toggle');
		const navLinks = document.getElementById('navbar-links');
		navToggle.addEventListener('click', () => {
			navLinks.classList.toggle('active');
		});

		// ===== Role tab switching =====
		const roleTabs = document.querySelectorAll('.role-tab');
		const roleInput = document.getElementById('role-input');
		const roleIcon = document.getElementById('role-icon');
		const loginTitle = document.querySelector('.login-logo h2');
		const emailInput = document.getElementById('email');

		const roleConfig = {
			student: {
				title: 'Student Login',
				placeholder: 'student@example.com'
			},
			lecturer: {
				title: 'Lecturer Login',
				placeholder: 'lecturer@example.com'
			},
			admin: {
				title: 'Administrator Login',
				placeholder: 'admin@tech4girls.org'
			}
		};

		roleTabs.forEach(tab => {
			tab.addEventListener('click', () => {
				// Remove active from all tabs
				roleTabs.forEach(t => t.classList.remove('active'));
				// Add active to clicked tab
				tab.classList.add('active');

				const role = tab.dataset.role;
				roleInput.value = role;

				// Update UI
				const config = roleConfig[role];
				roleIcon.textContent = config.icon;
				loginTitle.textContent = config.title;
				emailInput.placeholder = config.placeholder;
			});
		});

		// Initialize with student
		roleTabs[0].click();

		// ===== Form submission (demo) =====
		document.getElementById('login-form').addEventListener('submit', function(e) {
			e.preventDefault();
			const role = roleInput.value;
			const email = emailInput.value;
			
			// In a real app, this would POST to a backend
			alert(`Logging in as ${role}...\nEmail: ${email}\n\n(This is a demo — connect to your backend to authenticate.)`);
		});
	</script>
</body>
</html>
